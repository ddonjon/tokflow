<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 220px; padding: 15px; font-family: -apple-system, sans-serif; text-align: center; }
    h3 { margin-top: 0; color: #333; }
    button { 
      background: #ff0050; /* TikTok Red */
      color: white; 
      border: none; 
      padding: 10px 15px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold; 
      width: 100%;
      transition: 0.2s;
    }
    button:hover { background: #d00040; }
    #status { margin-top: 12px; font-size: 13px; color: #555; font-weight: 500; }
  </style>
</head>
<body>
  <h3>Tokflow</h3>
  <button id="grabBtn">Connect TikTok</button>
  <div id="status">Ready.</div>
  
  <script src="popup.js"></script>
</body>
</html>
